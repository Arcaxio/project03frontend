name: Deploy Vite App to GreenCloud VPS

on:
  push:
    branches:
      - main # Triggers when Jules PR is merged into main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/package@v4
        with:
          node-version: 20
          cache: 'npm' # or 'yarn' / 'pnpm'

      # Step 3: Install dependencies and build static dist files
      - name: Install & Build
        run: |
          npm ci
          npm run build

      # Step 4: Sync build directory (dist) to VPS via rsync
      - name: Deploy to VPS via SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          TARGET: "/var/www/my-vite-app"
          SOURCE: "dist/"
          ARGS: "-rlptgoD --delete"
